spring.application.name=transaction-reconciliation
spring.datasource.url=jdbc:postgresql://localhost:5432/reconciliation
# Overridden by SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD when those variables are set.
spring.datasource.username=reconciliation
spring.datasource.password=reconciliation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transaction-reconciliation
app.kafka.transactions-topic=transactions.accepted
app.kafka.transactions-dead-letter-topic=transactions.accepted.dlt
app.kafka.processing-attempts=3
app.kafka.processing-retry-interval=200ms
app.kafka.outbox-retry-interval-ms=500
# How long a repeated submission reuses the original transaction.
app.idempotency.time-to-live=24h